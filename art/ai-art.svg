<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- 机器人画家：画架上的彩虹 + 拿画笔的机器人 -->
  <g stroke="#4d3b28" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 画架腿 -->
    <path d="M62 108 L42 206" fill="none"/>
    <path d="M118 108 L138 206" fill="none"/>
    <path d="M90 112 L90 196" fill="none"/>
    <path d="M54 162 L126 162" fill="none" stroke-width="5"/>
    <!-- 画布 -->
    <rect x="34" y="42" width="112" height="76" rx="6" fill="#ffffff"/>
    <!-- 画：太阳 + 彩虹 -->
    <circle cx="58" cy="64" r="9" fill="#ffc93d"/>
    <path d="M76 98 A26 26 0 0 1 128 98" fill="none" stroke="#ff9fb2"/>
    <path d="M82 98 A20 20 0 0 1 122 98" fill="none" stroke="#ffc93d"/>
    <path d="M88 98 A14 14 0 0 1 116 98" fill="none" stroke="#6fd3ac"/>
    <!-- 机器人天线 -->
    <path d="M184 58 V40" fill="none" stroke-width="5"/>
    <circle cx="184" cy="33" r="7" fill="#ff8a3d" stroke-width="5"/>
    <!-- 机器人头 -->
    <rect x="150" y="58" width="68" height="54" rx="14" fill="#ffffff"/>
    <rect x="144" y="76" width="6" height="16" rx="3" fill="#ffc93d" stroke-width="4"/>
    <rect x="218" y="76" width="6" height="16" rx="3" fill="#ffc93d" stroke-width="4"/>
    <!-- 笑脸 -->
    <path d="M164 82 q5 -9 10 0" fill="none" stroke-width="5"/>
    <path d="M192 82 q5 -9 10 0" fill="none" stroke-width="5"/>
    <path d="M172 96 q8 8 16 0" fill="none" stroke-width="5"/>
    <!-- 身体 -->
    <rect x="160" y="112" width="48" height="36" rx="12" fill="#6fd3ac"/>
    <!-- 持笔手臂 + 画笔 -->
    <path d="M160 124 Q136 120 122 112" fill="none"/>
    <path d="M124 114 L104 98" fill="none" stroke-width="7"/>
    <path d="M104 98 l-14 -10 q-5 11 4 16 z" fill="#ff8a3d" stroke-width="4"/>
    <!-- 另一只手拿调色盘 -->
    <path d="M206 148 Q216 152 217 158" fill="none"/>
    <ellipse cx="219" cy="170" rx="20" ry="14" fill="#ffffff" stroke-width="5"/>
    <circle cx="212" cy="166" r="3.5" fill="#ff8a3d" stroke="none"/>
    <circle cx="222" cy="164" r="3.5" fill="#ffc93d" stroke="none"/>
    <circle cx="229" cy="172" r="3.5" fill="#6fd3ac" stroke="none"/>
    <circle cx="216" cy="176" r="3.5" fill="#ff9fb2" stroke="none"/>
  </g>
  <path d="M26 26 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5 z" fill="#ffc93d"/>
  <path d="M140 20 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#ff9fb2"/>
  <ellipse cx="106" cy="88" rx="7" ry="4" fill="#ff9fb2" transform="rotate(-24 106 88)"/>
</svg>
